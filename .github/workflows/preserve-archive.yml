name: Public archive preservation

# Manual only. Public repositories and standard hosted runners only.
on:
  workflow_dispatch:
    inputs:
      approved_plan_sha256:
        description: SHA256 of the reviewed acceleration/frozen/PLAN.json
        required: true
        type: string
      release_id:
        description: ID of the reviewed public snapshot-2026-09-20 draft release
        required: true
        type: string
      approval:
        description: Type APPROVED-PUBLIC-ARCHIVE after public-publication approval
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kalshi-cloud-preservation
  cancel-in-progress: false

jobs:
  preserve:
    if: ${{ inputs.approval == 'APPROVED-PUBLIC-ARCHIVE' && github.event.repository.private == false && github.repository == 'Rmartin612/kalshi-public-data-snapshot-2026-09-20' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out reviewed preservation helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preserve and verify one complete source shard
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          APPROVED_RELEASE_ID: ${{ inputs.release_id }}
          SHARD_INDEX: ${{ matrix.shard }}
          PYTHONUNBUFFERED: '1'
        run: >-
          python3 scripts/run_acceleration_shard.py
          --repo "${{ github.repository }}"
          --shard "$SHARD_INDEX"
          --release-id "$APPROVED_RELEASE_ID"
          --plan-sha256 "$APPROVED_PLAN_SHA256"
